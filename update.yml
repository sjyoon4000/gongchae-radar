name: Cartok 공채시세 갱신
on:
  schedule:
    - cron: '15 1,3,6 * * 1-5' # KST 10:15, 12:15, 15:15 (UTC)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/update_quotes.py
      - name: 변경 데이터 저장
        run: |
          if ! git diff --quiet -- www/data.json; then
            git config user.name 'bond-quote-bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add www/data.json
            git commit -m 'Update Cartok bond quotes'
            git push
          fi
