name: Update Cartok bond quotes

on:
  schedule:
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 0,1 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cartok-quotes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Fetch and validate latest Cartok quotes
        run: python update_quotes.py
      - name: Show fetched quote date
        run: python -c "import json; d=json.load(open('data.json')); print('Quote date:', d['market']['date'], 'Collected:', d['market'].get('collectedAt'))"
      - name: Commit verified quote changes
        run: |
          if git diff --quiet -- data.json; then
            echo "No new quote data"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update Cartok bond quotes"
          git push
