name: Play Store AAB build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html app-config.json data.json icon.svg manifest.webmanifest sw.js www/
      - name: Install and create Android project
        run: |
          npm install
          npx cap add android
      - name: Preserve edge-to-edge status bar and protect bottom banner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=list(Path('android/app/src/main/java').rglob('MainActivity.java'))
          assert len(files)==1, f'Expected one MainActivity.java, got {files}'
          p=files[0]
          src=p.read_text()
          package=re.search(r'^package\s+([\w.]+);',src,re.M)
          assert package, 'Cannot identify Android package'
          p.write_text(f'''package {package.group(1)};

          import android.os.Bundle;
          import android.view.View;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{
              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  getWindow().setStatusBarColor(0xFF0F172A);
                  getWindow().getDecorView().setSystemUiVisibility(0);
                  View webView=getBridge().getWebView();
                  webView.setBackgroundColor(0xFF0F172A);
                  // Keep the original edge-to-edge status bar appearance as requested.
                  // Only protect the bottom navigation area; do not offset the top content.
                  View content=findViewById(android.R.id.content);
                  ViewCompat.setOnApplyWindowInsetsListener(content, (v, insets) -> {{
                      androidx.core.graphics.Insets nav=insets.getInsets(
                          WindowInsetsCompat.Type.navigationBars());
                      androidx.core.graphics.Insets status=insets.getInsets(\n                          WindowInsetsCompat.Type.statusBars());\n                      v.setPadding(0, status.top, 0, nav.bottom);
                      return insets;
                  }});
                  ViewCompat.requestApplyInsets(content);
                  // Reserve a real native viewport area for the bottom AdMob banner.
                  // A CSS body padding only helps at the end of scrolling; it does not
                  // prevent the banner from covering content mid-scroll.
                  final float density=getResources().getDisplayMetrics().density;
                  final int adSpace=Math.round(64*density);
                  webView.post(() -> {{
                      android.view.ViewGroup.LayoutParams lp=webView.getLayoutParams();
                      if(lp instanceof android.view.ViewGroup.MarginLayoutParams) {{
                          android.view.ViewGroup.MarginLayoutParams mlp=
                              (android.view.ViewGroup.MarginLayoutParams)lp;
                          mlp.bottomMargin=adSpace;
                          webView.setLayoutParams(mlp);
                      }}
                  }});
              }}
          }}
          ''')
          PY
      - name: Require official app icon
        run: |
          test -f playstore-icon.png || (echo 'Upload playstore-icon.png to repository root first' && exit 1)
      - name: Generate all Android launcher icon resources
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          from xml.etree import ElementTree as ET
          src=Image.open('playstore-icon.png').convert('RGBA')
          assert src.width>=512 and src.height>=512, 'Play Store icon must be at least 512x512'
          root=Path('android/app/src/main/res')
          for density,px in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              folder=root/f'mipmap-{density}'
              folder.mkdir(parents=True,exist_ok=True)
              icon=src.resize((px,px),Image.Resampling.LANCZOS)
              icon.save(folder/'ic_launcher.png')
              icon.save(folder/'ic_launcher_round.png')
              (folder/'ic_launcher_foreground.png').unlink(missing_ok=True)
          # Replace Capacitor adaptive icons, which otherwise take precedence on modern Android.
          for folder in [root/'mipmap-anydpi-v26']:
              folder.mkdir(parents=True,exist_ok=True)
              for name in ['ic_launcher.xml','ic_launcher_round.xml']:
                  (folder/name).write_text('''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/gongchae_icon_background" />
            <foreground android:drawable="@drawable/gongchae_icon_foreground" />
          </adaptive-icon>
          ''')
          values=root/'values'
          values.mkdir(parents=True,exist_ok=True)
          (values/'gongchae_icon_colors.xml').write_text('<resources><color name="gongchae_icon_background">#0F172A</color></resources>')
          for legacy in ['ic_launcher.xml','ic_launcher_round.xml']:
              (root/'mipmap-anydpi'/legacy).unlink(missing_ok=True)
          drawable=root/'drawable'
          drawable.mkdir(parents=True,exist_ok=True)
          # Center the complete icon within the adaptive safe zone to avoid clipping.
          canvas=Image.new('RGBA',(432,432),(0,0,0,0))
          # Crop outer padding from source artwork, then fit within Android's safe zone.
          # This enlarges the logo without exceeding the adaptive icon mask.
          side=min(src.width,src.height)
          inset=round(side*0.11)
          cx,cy=src.width//2,src.height//2
          src=src.crop((cx-side//2+inset,cy-side//2+inset,cx+side//2-inset,cy+side//2-inset))
          art=src.resize((288,288),Image.Resampling.LANCZOS)
          canvas.alpha_composite(art,(72,72))
          canvas.save(drawable/'gongchae_icon_foreground.png')
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          txt=manifest.read_text()
          assert 'android:icon="@mipmap/ic_launcher"' in txt
          if 'android:roundIcon=' not in txt:
              txt=txt.replace('android:icon="@mipmap/ic_launcher"','android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"')
              manifest.write_text(txt)
          print('Verified launcher icons: legacy + adaptive, both mapped in AndroidManifest')
          PY
      - name: Configure AdMob and target API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text(); i=s.index('>',s.index('<application'))
          s=s[:i+1]+'\n<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-5012191593754335~9632395043" />'+s[i+1:]
          p.write_text(s)
          p=Path('android/variables.gradle')
          s=p.read_text()
          import re
          s=re.sub(r'targetSdkVersion\s*=\s*\d+','targetSdkVersion = 36',s)
          s=re.sub(r'compileSdkVersion\s*=\s*\d+','compileSdkVersion = 36',s)
          p.write_text(s)
          PY
      - name: Meet Google Play minimum SDK requirement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/variables.gradle')
          s=p.read_text()
          updated,n=re.subn(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 24', s)
          assert n==1, f'Expected one minSdkVersion in {p}, found {n}'
          p.write_text(updated)
          print('Set minSdkVersion=24 for Google Play automatic protection')
          PY
      - name: Set unique Play Store version code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/build.gradle')
          s=p.read_text()
          code=int("${{ github.run_number }}")+1
          updated,n=re.subn(r'versionCode\s+\d+', f'versionCode {code}', s)
          assert n==1, f'Expected one versionCode, found {n}'
          p.write_text(updated)
          print(f'Play Store versionCode={code}')
          PY
      - name: Enable R8 code shrinking and optimization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/build.gradle')
          s=p.read_text()
          match=re.search(r'(release\\s*\\{)',s)
          assert match, 'Cannot find release build type'
          # Capacitor-generated release configuration may have minifyEnabled false.
          start=match.end()
          s=s[:start]+'''
                  minifyEnabled true
                  shrinkResources true
          '''+s[start:]
          s=re.sub(r'(?m)^\\s*minifyEnabled\\s+false\\s*
        working-directory: android
        run: chmod +x gradlew && ./gradlew bundleRelease --no-daemon
      - name: Sign bundle with upload key (when configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo 'No signing secrets. Bundle is unsigned and cannot be submitted to Play.'
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -signedjar android/app/build/outputs/bundle/release/app-release-signed.aab android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          jarsigner -verify android/app/build/outputs/bundle/release/app-release-signed.aab
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: gongchae-radar-playstore-aab
          path: android/app/build/outputs/bundle/release/*.aab
, '', s)
          s=re.sub(r'(?m)^\\s*shrinkResources\\s+false\\s*
        working-directory: android
        run: chmod +x gradlew && ./gradlew bundleRelease --no-daemon
      - name: Sign bundle with upload key (when configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo 'No signing secrets. Bundle is unsigned and cannot be submitted to Play.'
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -signedjar android/app/build/outputs/bundle/release/app-release-signed.aab android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          jarsigner -verify android/app/build/outputs/bundle/release/app-release-signed.aab
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: gongchae-radar-playstore-aab
          path: android/app/build/outputs/bundle/release/*.aab
, '', s)
          p.write_text(s)
          print('R8 minifyEnabled and shrinkResources enabled')
          PY
      - name: Build release bundle
        working-directory: android
        run: chmod +x gradlew && ./gradlew bundleRelease --no-daemon
      - name: Sign bundle with upload key (when configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo 'No signing secrets. Bundle is unsigned and cannot be submitted to Play.'
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -signedjar android/app/build/outputs/bundle/release/app-release-signed.aab android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          jarsigner -verify android/app/build/outputs/bundle/release/app-release-signed.aab
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: gongchae-radar-playstore-aab
          path: android/app/build/outputs/bundle/release/*.aab
