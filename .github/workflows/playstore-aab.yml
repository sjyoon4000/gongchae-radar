name: Play Store AAB build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html app-config.json data.json icon.svg manifest.webmanifest sw.js www/
      - name: Install and create Android project
        run: |
          npm install
          npx cap add android
      - name: Require official app icon
        run: |
          test -f playstore-icon.png || (echo 'Upload playstore-icon.png to repository root first' && exit 1)
      - name: Generate Android launcher icons
        run: |
          python3 -m pip install Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          im=Image.open('playstore-icon.png').convert('RGBA')
          for density,px in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              p=Path(f'android/app/src/main/res/mipmap-{density}')
              p.mkdir(parents=True,exist_ok=True)
              im.resize((px,px),Image.Resampling.LANCZOS).save(p/'ic_launcher.png')
              im.resize((px,px),Image.Resampling.LANCZOS).save(p/'ic_launcher_round.png')
          PY
      - name: Configure AdMob and target API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text(); i=s.index('>',s.index('<application'))
          s=s[:i+1]+'\\n<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-5012191593754335~9632395043" />'+s[i+1:]
          p.write_text(s)
          p=Path('android/variables.gradle')
          s=p.read_text()
          import re
          s=re.sub(r'targetSdkVersion\\s*=\\s*\\d+','targetSdkVersion = 36',s)
          s=re.sub(r'compileSdkVersion\\s*=\\s*\\d+','compileSdkVersion = 36',s)
          p.write_text(s)
          PY
      - name: Build release bundle
        working-directory: android
        run: chmod +x gradlew && ./gradlew bundleRelease --no-daemon
      - name: Sign bundle with upload key (when configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo 'No signing secrets. Bundle is unsigned and cannot be submitted to Play.'
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -signedjar android/app/build/outputs/bundle/release/app-release-signed.aab android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          jarsigner -verify android/app/build/outputs/bundle/release/app-release-signed.aab
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: gongchae-radar-playstore-aab
          path: android/app/build/outputs/bundle/release/*.aab
