name: Android app build (test APK)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use preinstalled Android SDK
        run: echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
      - name: Prepare Capacitor web assets
        run: |
          mkdir -p www
          cp index.html app-config.json data.json icon.svg manifest.webmanifest sw.js www/
      - name: Install dependencies
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Respect Android system status and navigation bars
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=list(Path('android/app/src/main/java').rglob('MainActivity.java'))
          assert len(files)==1, f'Expected one MainActivity.java, got {files}'
          p=files[0]
          src=p.read_text()
          package=re.search(r'^package\s+([\w.]+);',src,re.M)
          assert package, 'Cannot identify Android package'
          p.write_text(f'''package {package.group(1)};

          import android.os.Bundle;
          import android.view.View;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{
              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  View webView = getBridge().getWebView();
                  webView.setBackgroundColor(0xFF0F172A);
                  ViewCompat.setOnApplyWindowInsetsListener(webView, (view, insets) -> {{
                      androidx.core.graphics.Insets bars = insets.getInsets(WindowInsetsCompat.Type.systemBars());
                      view.setPadding(0, bars.top, 0, bars.bottom);
                      return insets;
                  }});
                  ViewCompat.requestApplyInsets(webView);
              }}
          }}
          ''')
          PY
      - name: Generate all Android launcher icon resources
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          from xml.etree import ElementTree as ET
          src=Image.open('playstore-icon.png').convert('RGBA')
          assert src.width>=512 and src.height>=512, 'Play Store icon must be at least 512x512'
          root=Path('android/app/src/main/res')
          for density,px in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              folder=root/f'mipmap-{density}'
              folder.mkdir(parents=True,exist_ok=True)
              icon=src.resize((px,px),Image.Resampling.LANCZOS)
              icon.save(folder/'ic_launcher.png')
              icon.save(folder/'ic_launcher_round.png')
              (folder/'ic_launcher_foreground.png').unlink(missing_ok=True)
          # Replace Capacitor adaptive icons, which otherwise take precedence on modern Android.
          for folder in [root/'mipmap-anydpi-v26',root/'mipmap-anydpi']:
              folder.mkdir(parents=True,exist_ok=True)
              for name in ['ic_launcher.xml','ic_launcher_round.xml']:
                  (folder/name).write_text('''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/gongchae_icon_background" />
            <foreground android:drawable="@drawable/gongchae_icon_foreground" />
          </adaptive-icon>
          ''')
          values=root/'values'
          values.mkdir(parents=True,exist_ok=True)
          (values/'gongchae_icon_colors.xml').write_text('<resources><color name="gongchae_icon_background">#0F172A</color></resources>')
          drawable=root/'drawable'
          drawable.mkdir(parents=True,exist_ok=True)
          # Center the complete icon within the adaptive safe zone to avoid clipping.
          canvas=Image.new('RGBA',(432,432),(0,0,0,0))
          art=src.resize((288,288),Image.Resampling.LANCZOS)
          canvas.alpha_composite(art,(72,72))
          canvas.save(drawable/'gongchae_icon_foreground.png')
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          txt=manifest.read_text()
          assert 'android:icon="@mipmap/ic_launcher"' in txt
          if 'android:roundIcon=' not in txt:
              txt=txt.replace('android:icon="@mipmap/ic_launcher"','android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"')
              manifest.write_text(txt)
          print('Verified launcher icons: legacy + adaptive, both mapped in AndroidManifest')
          PY
      - name: Configure Android AdMob app ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<application'
          assert marker in s
          start=s.index(marker)
          end=s.index('>',start)
          s=s[:end+1]+'''\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-5012191593754335~9632395043" />'''+s[end+1:]
          p.write_text(s)
          PY
      - name: Build installable debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gongchae-radar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
