name: Android app build (test APK)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use preinstalled Android SDK
        run: echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
      - name: Prepare Capacitor web assets
        run: |
          mkdir -p www
          cp index.html app-config.json data.json icon.svg manifest.webmanifest sw.js www/
      - name: Install dependencies
        run: npm install
      - name: Create Android project
        run: npx cap add android
      - name: Respect Android system status and navigation bars
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=list(Path('android/app/src/main/java').rglob('MainActivity.java'))
          assert len(files)==1, f'Expected one MainActivity.java, got {files}'
          p=files[0]
          src=p.read_text()
          package=re.search(r'^package\s+([\w.]+);',src,re.M)
          assert package, 'Cannot identify Android package'
          p.write_text(f'''package {package.group(1)};

          import android.os.Bundle;
          import android.view.View;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{
              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  View webView = getBridge().getWebView();
                  webView.setBackgroundColor(0xFF0F172A);
                  ViewCompat.setOnApplyWindowInsetsListener(webView, (view, insets) -> {{
                      androidx.core.graphics.Insets bars = insets.getInsets(WindowInsetsCompat.Type.systemBars());
                      view.setPadding(0, bars.top, 0, bars.bottom);
                      return insets;
                  }});
                  ViewCompat.requestApplyInsets(webView);
              }}
          }}
          ''')
          PY
      - name: Apply custom launcher icon
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          im=Image.open('playstore-icon.png').convert('RGBA')
          for density,px in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              p=Path(f'android/app/src/main/res/mipmap-{density}')
              p.mkdir(parents=True,exist_ok=True)
              im.resize((px,px),Image.Resampling.LANCZOS).save(p/'ic_launcher.png')
              im.resize((px,px),Image.Resampling.LANCZOS).save(p/'ic_launcher_round.png')
          PY
      - name: Configure Android AdMob app ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<application'
          assert marker in s
          start=s.index(marker)
          end=s.index('>',start)
          s=s[:end+1]+'''\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-5012191593754335~9632395043" />'''+s[end+1:]
          p.write_text(s)
          PY
      - name: Build installable debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gongchae-radar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
